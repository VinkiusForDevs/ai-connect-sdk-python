# Runs the offline test suite on every PR and on pushes to the default branch.
# Fast, deterministic, no secrets needed.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The SDK supports 3.10+; test the supported range end to end.
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install (editable, with test extras)
        run: python -m pip install -e ".[test]"
      - name: Run tests
        run: python -m pytest -q
