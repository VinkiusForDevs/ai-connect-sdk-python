# Build and publish `vinkius-connect` to PyPI, driven entirely by git tags.
#
#   tag v0.x   -> TestPyPI   (standard "pre-1.0 goes to the test registry" split)
#   tag v1.0+  -> PyPI
#
# A manual "Publish" dispatch is also available to publish to either registry
# on demand (useful before 1.0, or to force a TestPyPI run).
#
# Secrets (set in the repo's Settings > Secrets and variables > Actions):
#   PYPI_API_TOKEN         PyPI API token     (looks like: pypi-...)
#   TEST_PYPI_API_TOKEN    TestPyPI API token (looks like: testpypi-...)
# Tokens are created from each account's "Account settings > API tokens".
name: Publish to PyPI

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      registry:
        description: "Publish to"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi

permissions:
  contents: read

jobs:
  # Gate: run the offline suite once before we spend anything on publishing.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q

  testpypi:
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.ref_type == 'tag' && startsWith(github.ref, 'refs/tags/v0.')) ||
      (github.ref_type == 'manual' && inputs.registry == 'testpypi')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build && python -m build
      - name: Validate
        run: python -m pip install twine && python -m twine check dist/*
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.TEST_PYPI_API_TOKEN }}
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: test
    runs-on: ubuntu-latest
    if: |
      (github.ref_type == 'tag' && !startsWith(github.ref, 'refs/tags/v0.')) ||
      (github.ref_type == 'manual' && inputs.registry == 'pypi')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build
        run: python -m pip install build && python -m build
      - name: Validate
        run: python -m pip install twine && python -m twine check dist/*
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
